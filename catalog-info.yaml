---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: teupadel-gitops
  description: 'GitOps deployment (ArgoCD) for teupadel.com — AI padel movement analysis'
  tags:
    - kubernetes
    - homelab
    - infrastructure
  annotations:
    github.com/project-slug: cmoreira-dev/gitops.teupadel.com
    backstage.io/kubernetes-id: homelab
    # argocd/app-name does NOT split on commas in @backstage-community/
    # plugin-argocd — it only splits argocd/instance-name that way. A CSV
    # value here gets sent to ArgoCD's API as one literal (nonexistent) app
    # name, silently returning zero results. app-selector is the documented
    # way to match multiple Applications; the label lives on each
    # Application manifest under argocd/ in this repo.
    argocd/app-selector: 'homelab.cmoreira.dev/catalog-component=teupadel-gitops'
    backstage.io/techdocs-ref: dir:.
  links:
    - url: 'https://www.teupadel.com'
      title: teupadel.com
      icon: dashboard
spec:
  type: website
  owner: platform-team
  system: teupadel
  lifecycle: production
  dependsOn:
    - component:teupadel-api
    - component:teupadel-ui
    - component:pose-estimation
---
# External and stateful dependencies of the teupadel product, modelled as
# Resources so the API's dependsOn graph shows what it actually needs.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: teupadel-db
  description: >-
    PostgreSQL database (CloudNativePG Cluster `teupadel`, database
    `teupadeldb`) — accounts, sessions, bolas ledger, report history, waitlist.
    Schema applied by the API's `migrate` init container.
  tags:
    - postgres
spec:
  type: database
  owner: platform-team
  system: teupadel
  dependsOn:
    - component:cnpg
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: teupadel-amazon-ses
  description: >-
    Amazon SES (us-east-1, identity `teupadel.com`) — sends the magic-link
    e-mail. Still in sandbox: only verified identities receive mail.
spec:
  type: email-service
  owner: platform-team
  system: teupadel
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: teupadel-google-oauth
  description: >-
    Google OAuth client (Google Cloud) used by "Sign in with Google";
    credentials live in SSM under /teupadel/google/oauth/.
spec:
  type: identity-provider
  owner: platform-team
  system: teupadel
