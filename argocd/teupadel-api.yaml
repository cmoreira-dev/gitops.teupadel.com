apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teupadel-api
  namespace: argocd
spec:
  project: homelab
  source:
    # Era gitops.padel-movement-analysis (nome antigo, pré-rename) — funcionava
    # só por causa do redirect 301 do GitHub, não é garantido para sempre.
    repoURL: https://github.com/cmoreira-dev/gitops.teupadel.com.git
    targetRevision: main
    path: helm/api
  destination:
    server: https://kubernetes.default.svc
    namespace: teupadel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true