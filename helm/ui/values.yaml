generic-app:
  nameOverride: "teupadel-ui"
  namespace:
    create: true
    name: "teupadel"
  image:
    repository: "344965637185.dkr.ecr.us-east-1.amazonaws.com/teupadel/ui"
    tag: "4ea8bb4"
  service:
    port: 80
    targetPort: 3000 # porta real que o container escuta (non-root, generic-app 0.7.0)
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  probes:
    liveness:
      enabled: true
      httpGet:
        path: /health
        port: http
    readiness:
      enabled: true
      httpGet:
        path: /health
        port: http
  httpRoute:
    enabled: true
    gateway:
      name: nginx-gateway-teupadel-com
      namespace: nginx-gateway
    hostnames:
    - "www.teupadel.com"
  # Chave pública do Turnstile (vem do Terraform, por isso via SSM em vez de
  # hardcoded). A UI lê TURNSTILE_SITE_KEY em runtime (login/page.jsx).
  externalSecrets:
    enabled: true
    secretStoreRef:
      name: aws-ssm
      kind: ClusterSecretStore
    secretName: "teupadel-ui-secret"
    data:
    - secretKey: TURNSTILE_SITE_KEY
      remoteRef:
        key: /teupadel/turnstile/site-key
  configMap:
    enabled: true
    injectAsEnv: true
    data:
      # A UI (Next.js/SSR) só fala com a API server-side: o browser chama
      # `/analyse` na própria UI e o Route Handler `src/app/analyse/route.js`
      # faz proxy para `${PADEL_API_URL}/analyse`, lendo esta env var a cada
      # pedido. Como é pod->pod, aponta para o Service interno em vez do
      # domínio público (api.teupadel.com já não precisa de estar exposto).
      PADEL_API_URL: "http://teupadel-api.teupadel.svc.cluster.local"
