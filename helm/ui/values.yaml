generic-app:
  nameOverride: "teupadel-ui"

  namespace:
    create: true
    name: "teupadel"

  image:
    repository: "344965637185.dkr.ecr.us-east-1.amazonaws.com/teupadel/ui"
    tag: "latest"

  service:
    port: 80
    targetPort: 80 # porta real que o container escuta

  httpRoute:
    enabled: true
    gateway:
      name: nginx-gateway-teupadel-com
      namespace: nginx-gateway
    hostnames:
      - "www.teupadel.com"

  configMap:
    enabled: true
    injectAsEnv: true
    # Renamed from VITE_PADEL_API_URL (2026-08): a UI passou de Vite/CSR para
    # Next.js/SSR e agora lê esta env var server-side (next.config.js rewrites),
    # nunca no browser. ORDEM DE DEPLOY: este rename só pode ir para produção
    # depois de a imagem `teupadel/ui` correspondente (a que já lê
    # PADEL_API_URL) estar buildada e publicada no ECR — caso contrário o pod
    # sobe com a imagem antiga (que ainda espera VITE_PADEL_API_URL) e fica
    # sem saber o endereço da API. Fazer merge deste values.yaml só depois de
    # confirmar que a tag da imagem em `image.tag` já corresponde ao build novo.
    data:
      PADEL_API_URL: "https://api.teupadel.com"

externalSecrets:
  enabled: true
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  secretName: "teupadel-ui-secret"
  data:
    - secretKey: some-key
      remoteRef:
        key: /homelab/teupadel/anthropic_ui_key
