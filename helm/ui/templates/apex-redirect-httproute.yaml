# The generic-app chart's HTTPRoute template only supports one shared
# `hostnames` list per release, all rules pointed at the same backend — it
# can't route www.teupadel.com to the app AND teupadel.com to a redirect in
# the same HTTPRoute. So the apex → www redirect is this separate, minimal
# HTTPRoute, matching the pattern already used for psirenatalima.com
# (gitops.psirenatalima.com) and the corresponding cloudflared tunnel
# ingress entry for the bare "teupadel.com" hostname
# (gitops.core-addons/kustomize/cloudflared/configmap.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: teupadel-apex-redirect
  namespace: teupadel
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nginx-gateway-teupadel-com
      namespace: nginx-gateway
  hostnames:
    - "teupadel.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: www.teupadel.com
            statusCode: 301
