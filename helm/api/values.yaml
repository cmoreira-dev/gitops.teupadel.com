generic-app:
  nameOverride: "teupadel-api"
  namespace:
    create: true
    name: "teupadel"
  image:
    repository: "344965637185.dkr.ecr.us-east-1.amazonaws.com/teupadel/api"
    tag: "f7e4404"
  service:
    port: 80
    targetPort: 8080 # porta real que o container escuta
  # Sem httpRoute: a API não é exposta publicamente. A UI fala com ela pelo
  # Service interno (teupadel-api.teupadel.svc.cluster.local). Ver
  # ui/values.yaml (PADEL_API_URL) e o cloudflared em gitops.core-addons.
  configMap:
    enabled: true
    injectAsEnv: true
    data:
      ANTHROPIC_MODEL: "claude-sonnet-5"
      # --- Telemetria / OpenTelemetry (ver api.ia.teupadel.com/telemetry.py) ---
      # O Alloy worker (gitops.monitoring) já expõe um receiver OTLP e encaminha
      # para Grafana Cloud (Tempo/Mimir/Loki). Se OTEL_EXPORTER_OTLP_ENDPOINT for
      # removido, a instrumentação fica no-op e a app continua a servir.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy-worker.alloy.svc.cluster.local:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_NAME: "teupadel-api"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=teupadel,deployment.environment=production"
      OTEL_TRACES_SAMPLER: "parentbased_always_on"
  externalSecrets:
    enabled: true
    secretStoreRef:
      name: aws-ssm
      kind: ClusterSecretStore
    secretName: "teupadel-api-secret"
    data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: /homelab/teupadel/anthropic-api-key
