generic-app:
  nameOverride: "teupadel-api"
  namespace:
    create: true
    name: "teupadel"
  image:
    repository: "344965637185.dkr.ecr.us-east-1.amazonaws.com/teupadel/api"
    tag: "25da1b5"
  service:
    port: 80
    targetPort: 8080 # porta real que o container escuta
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsUser: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  # Executa o schema antes de qualquer réplica da API receber tráfego. O chart
  # genérico aplica o podSecurityContext ao pod e este securityContext ao
  # initContainer, mantendo o perfil restricted também neste processo.
  initContainers:
  - name: migrate
    command: ["python", "-m", "migrate"]
    securityContext:
      runAsUser: 10001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    env:
    - name: PGHOST
      valueFrom:
        secretKeyRef:
          name: teupadel-app
          key: host
    - name: PGPORT
      valueFrom:
        secretKeyRef:
          name: teupadel-app
          key: port
    - name: PGUSER
      valueFrom:
        secretKeyRef:
          name: teupadel-app
          key: user
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: teupadel-app
          key: password
    - name: PGDATABASE
      value: "teupadeldb"
    envFrom:
    - configMapRef:
        name: teupadel-api
    - secretRef:
        name: teupadel-api-secret
  probes:
    liveness:
      enabled: true
      httpGet:
        path: /health
        port: http
    readiness:
      enabled: true
      httpGet:
        path: /health
        port: http
  # Sem httpRoute: a API não é exposta publicamente. A UI fala com ela pelo
  # Service interno (teupadel-api.teupadel.svc.cluster.local). Ver
  # ui/values.yaml (PADEL_API_URL) e o cloudflared em gitops.core-addons.

  replicaCount: 2
  # Cada /analyse segura o vídeo em memória durante ~110s. Com 256Mi o pod era
  # OOMKilled num upload de ~70MB (confirmado 2026-08-31). 1Gi dá folga para
  # 1-2 análises concorrentes; o streaming do upload fica para depois.
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  configMap:
    enabled: true
    injectAsEnv: true
    data:
      ANTHROPIC_MODEL: "claude-sonnet-5"
      # Cutover feito 2026-08-31: o padel-processor corre no cluster com GPU
      # (api.ia.pose-estimation). Benchmark: 150 frames 1080p em ~10s (LXC/CPU
      # eram ~87s). O LXC 192.168.1.20 foi desativado/removido no Proxmox (2026-08).
      PROCESSOR_URL: "http://teupadel-processor.teupadel.svc.cluster.local:8000"
      # A chamada do relatório passa pelo passthrough Anthropic do LiteLLM
      # (llm.cmoreira.dev / litellm ns) — spend por virtual key, fallback,
      # chave central. O body é encaminhado cru → tool use / prompt caching /
      # thinking intactos. `ANTHROPIC_API_KEY` (abaixo) passa a ser a virtual
      # key do LiteLLM. Remover esta var = volta a chamar a Anthropic direto.
      ANTHROPIC_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000/anthropic"
      # --- Telemetria / OpenTelemetry (ver api.ia.teupadel.com/telemetry.py) ---
      # O Alloy worker (gitops.monitoring) já expõe um receiver OTLP e encaminha
      # para Grafana Cloud (Tempo/Mimir/Loki). Se OTEL_EXPORTER_OTLP_ENDPOINT for
      # removido, a instrumentação fica no-op e a app continua a servir.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy-worker.alloy.svc.cluster.local:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_NAME: "teupadel-api"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=teupadel,deployment.environment=production"
      OTEL_TRACES_SAMPLER: "parentbased_always_on"
      # Nome fixo, não segredo — definido em gitops.cnpg/kustomize/teupadel/database.yaml
      # (bootstrap.initdb.database).
      PGDATABASE: "teupadeldb"
      # --- Autenticação (Fase 4 — ver api.ia.teupadel.com/auth.py) ---
      # UI pública, usada para montar links de e-mail e o redirect_uri do
      # Google (esta API nunca é pública — ver comentário do httpRoute acima).
      FRONTEND_URL: "https://teupadel.com"
      SES_REGION: "us-east-1"
      SES_SENDER: "TeuPadel <noreply@teupadel.com>"
      SES_CONFIGURATION_SET: "teupadel-transactional"
      # Fila SQS de eventos do SES (bounces/reclamações) consumida pelo worker da API
      # (ses_events.py). Precisa do IAM (iac.homelab-live-infra, unit ses-smtp-user).
      SES_EVENTS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/344965637185/teupadel-ses-events"
      # Fila durável de análises (ver api.ia.teupadel.com/uploads.py): o browser envia o vídeo por
      # partes, por URL pré-assinada, para este bucket da UE (IaC: aws/cmoreira-dev/us-east-1/
      # s3-analysis-uploads); o worker da API processa e APAGA o vídeo. Usa as mesmas credenciais AWS
      # do usuário teupadel-api (a policy do bucket está no IaC). Remover estas vars desliga a fila:
      # /analyses* passa a dar 503 e o POST /analyse antigo continua a funcionar.
      ANALYSIS_UPLOADS_BUCKET: "cmoreira-dev-teupadel-analysis-uploads-eu"
      ANALYSIS_UPLOADS_REGION: "eu-west-1"
  externalSecrets:
    enabled: true
    secretStoreRef:
      name: aws-ssm
      kind: ClusterSecretStore
    secretName: "teupadel-api-secret"
    data:
    # Virtual key do LiteLLM (não a chave Anthropic real — ver ANTHROPIC_BASE_URL
    # no configMap). Rollback: voltar a /homelab/teupadel/anthropic-api-key e
    # remover ANTHROPIC_BASE_URL.
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: /homelab/teupadel/litellm-key
    # --- Autenticação (Fase 4) ---
    - secretKey: GOOGLE_OAUTH_CLIENT_ID
      remoteRef:
        key: /teupadel/google/oauth/client_id
    - secretKey: GOOGLE_OAUTH_CLIENT_SECRET
      remoteRef:
        key: /teupadel/google/oauth/client_secret
    # Assina o cookie de state do fluxo OAuth do Google — tem de ser igual
    # em todos os replicas (replicaCount: 2), daí vir do SSM e não ser gerado
    # em runtime por cada pod (ver aviso em main.py se esta faltar).
    - secretKey: SESSION_SECRET_KEY
      remoteRef:
        key: /teupadel/api/session-secret-key
    # Cloudflare Turnstile (login): chave secreta do widget criado por IaC
    # (iac.homelab-live-infra, unit aws/.../turnstile-ssm).
    - secretKey: TURNSTILE_SECRET_KEY
      remoteRef:
        key: /teupadel/turnstile/secret-key
    # /teupadel/ses/api é um único JSON (access_key_id/secret_access_key/
    # smtp_username/smtp_password — ver iac-mail-routing/module/aws-ses-smtp-user);
    # `property` extrai só o par de chaves que o boto3 (email_sender.py) lê
    # automaticamente via AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY.
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /teupadel/ses/api
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /teupadel/ses/api
        property: secret_access_key
  # Credenciais Postgres vêm do Secret "teupadel-app" que o CNPG gera
  # sozinho (gitops.cnpg/kustomize/teupadel), não de um ExternalSecret/SSM —
  # é gerado no cluster, nunca sai dele. Mesmo namespace ("teupadel"), por
  # isso o secretKeyRef simples funciona sem replicação cross-namespace.
  # PGHOST/PGPORT/PGUSER/PGPASSWORD são nomes padrão libpq — psycopg2/
  # asyncpg leem-nos automaticamente, sem precisar montar um DATABASE_URL à
  # mão. Chaves confirmadas contra o uso real em
  # gitops.backstage.homelab/helm/backstage/values.yaml (host/port/user/
  # password) — não "uri"/"username" como se poderia assumir de outras
  # stacks CNPG.
  env:
  - name: PGHOST
    valueFrom:
      secretKeyRef:
        name: teupadel-app
        key: host
  - name: PGPORT
    valueFrom:
      secretKeyRef:
        name: teupadel-app
        key: port
  - name: PGUSER
    valueFrom:
      secretKeyRef:
        name: teupadel-app
        key: user
  - name: PGPASSWORD
    valueFrom:
      secretKeyRef:
        name: teupadel-app
        key: password
